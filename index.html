      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {

      /* Global button and interactive styles */

      }

      .btn-pill:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }

      .btn-pill:active {

        transition: all 0.1s ease;
      }

      /* Liquid glass effect */
      .glass-effect {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px) saturate(180%);

        border: 1px solid rgba(255, 255, 255, 0.3);
      }

        border: 1px solid rgba(255, 255, 255, 0.1);

      /* Primary button color */

      /* Accessibility Modes */

      /* Normal mode - default */
      .accessibility-normal {
        /* Default styles - no changes needed */
      }

      /* High Contrast mode */
      .accessibility-contrast {
        --text-contrast: 1.2;
      }

      .accessibility-contrast * {
        font-weight: 500 !important;
      }

      .accessibility-contrast p,
      .accessibility-contrast span,
      .accessibility-contrast h1,
      .accessibility-contrast h2,
      .accessibility-contrast h3,
      .accessibility-contrast h4,
      .accessibility-contrast h5,
      .accessibility-contrast h6 {

      }

        color: #6b7280 !important;
      }

        color: #374151 !important;
      }

        color: #1f2937 !important;
      }

      /* Dyslexic-friendly mode */

        font-family: 'OpenDyslexic', 'Comic Sans MS', 'Arial', sans-serif !important;
        letter-spacing: 0.05em;
        word-spacing: 0.1em;
        line-height: 1.8 !important;
      }

      .accessibility-dyslexic * {
        font-family: inherit !important;
        letter-spacing: inherit;
        word-spacing: inherit;
      }

      .accessibility-dyslexic span,

          margin: 1.5cm;
        }

        body * {

        }

        #resume-print-content,
        #resume-print-content * {

        }

        #resume-print-content {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          background: white !important;
        }

        /* Hide modal chrome and buttons */

          display: none !important;
        }

          box-shadow: none !important;
          border-radius: 0 !important;
        }
