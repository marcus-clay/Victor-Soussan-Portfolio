<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Victor Soussan | Product Design Lead</title>
    <!-- We keep Tailwind CDN for simplicity as per current setup, though a build step for CSS is recommended for production -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              apple: {
                gray: '#F5F5F7',
                dark: '#1D1D1F',
                blue: '#0071E3',
                glass: 'rgba(255, 255, 255, 0.72)',
                glassBorder: 'rgba(255, 255, 255, 0.5)',
              }
            },
            backdropBlur: {
              xs: '2px',
            }
          }
        }
      }
    </script>
    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #D1D5DB;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9CA3AF;
      }
      html {
        scroll-behavior: smooth;
      }

      /* Global button and interactive styles */
      .btn-pill {
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .btn-pill:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }

      .btn-pill:active {
        transform: scale(0.98) translateY(0);
        transition: all 0.1s ease;
      }

      /* Liquid glass effect */
      .glass-effect {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .glass-dark {
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Accent color - dark */
      .accent-blue {
        background: #0F0F0F;
      }

      .accent-blue:hover {
        background: #1a1a1a;
      }

      /* Print styles for resume */
      @media print {
        @page {
          size: A4;
          margin: 1.5cm;
        }

        body * {
          visibility: hidden;
        }

        #resume-print-content,
        #resume-print-content * {
          visibility: visible;
        }

        #resume-print-content {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          background: white !important;
        }

        /* Hide modal chrome and buttons */
        .no-print {
          display: none !important;
        }

        /* Remove shadows, borders, and backgrounds */
        * {
          box-shadow: none !important;
          border-radius: 0 !important;
        }

        /* Ensure proper page breaks */
        section {
          page-break-inside: avoid;
        }

        h1, h2, h3, h4, h5, h6 {
          page-break-after: avoid;
        }

        /* Optimize spacing for print */
        body {
          font-size: 11pt;
          line-height: 1.4;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "vite": "https://aistudiocdn.com/vite@^7.2.4",

    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
</head>

    <script type="module" src="/index.tsx"></script>

</html>
